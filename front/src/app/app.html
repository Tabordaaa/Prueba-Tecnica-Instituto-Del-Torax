<header class="topbar">
  <span class="brand">Instituto del Torax</span>

  <!-- Barra de navegacion: solo si hay sesion iniciada -->
  @if (authService.isLoggedIn()) {
    <nav>
      <a routerLink="/home" routerLinkActive="active">Inicio</a>
      @if (authService.isAdmin()) {
        <a routerLink="/users" routerLinkActive="active">Usuarios</a>
      }
      <button type="button" class="link" (click)="logout()">Salir</button>
    </nav>
  }
</header>

<main>
  <router-outlet />
</main>
